# Knowledge Service 与 Agent 的本地开发覆盖配置。
#
# 与基础 Compose 文件一起使用：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d knowledge-service agent-app
#
# 这些 bind mount 让运行中的容器直接读取宿主机最新源码，不会修改镜像。
# Python 源码变化无需重建；依赖、Dockerfile 或系统库变化仍需重新构建镜像。
services:
  knowledge-service:
    # 开发模式监听统一 Knowledge 命名空间。
    environment:
      - KNOWLEDGE_SERVICE_EVALUATION_API_ENABLED=true
    command:
      - python
      - -m
      - uvicorn
      - knowledge.server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/knowledge
    volumes:
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
        bind:
          create_host_path: false

  agent-app:
    volumes:
      # Streamlit、FastAPI、MCP 和建库任务共用的主要 Python 包。
      - type: bind
        source: ./react_agent
        target: /app/react_agent
        read_only: true
        bind:
          create_host_path: false

      # 独立 MCP 协议适配器；不再属于 react_agent 包。
      - type: bind
        source: ./mcp_service
        target: /app/mcp_service
        read_only: true
        bind:
          create_host_path: false

      # Knowledge 核心、HTTP 客户端与服务端共享命名空间。
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
        bind:
          create_host_path: false

      # FastAPI 应用源码。
      - type: bind
        source: ./api
        target: /app/api
        read_only: true
        bind:
          create_host_path: false

      # 当前 Streamlit 从 tests/test_agent.py 启动。
      - type: bind
        source: ./tests
        target: /app/tests
        read_only: true
        bind:
          create_host_path: false

      # 可通过 compose run 执行的开发与诊断脚本。
      - type: bind
        source: ./scripts
        target: /app/scripts
        read_only: true
        bind:
          create_host_path: false

      # RAG 评测和数据集脚本通过 Agent 客户端访问 Knowledge Service。
      - type: bind
        source: ./eval
        target: /app/eval
        read_only: true
        bind:
          create_host_path: false

      # MCP stdio 薄启动入口。
      - type: bind
        source: ./mcp_rag_server.py
        target: /app/mcp_rag_server.py
        read_only: true
        bind:
          create_host_path: false

  eval-runner:
    # 一次性评测容器也读取宿主机最新源码；Python 改动无需重建镜像。
    volumes:
      - type: bind
        source: ./react_agent
        target: /app/react_agent
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./eval
        target: /app/eval
        read_only: true
        bind:
          create_host_path: false
