name: Project CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEEPSEEK_API_KEY: test-only-fake-key
      TAVILY_API_KEY: test-only-fake-key

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1,<26"
          python -m pip install -e . --group dev

      - name: Run Ruff
        run: |
          python -m ruff check react_agent api knowledge tests

      - name: Run offline tests
        run: |
          python -m pytest tests \
            --ignore=tests/test_agent.py \
            -q \
            --cov=react_agent \
            --cov=api \
            --cov=knowledge \
            --cov-report=term \
            --cov-fail-under=35
