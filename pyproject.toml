[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "react_agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.4",
    "langchain-anthropic==1.3.1",
    "langchain-chroma==1.1.0",
    # Chroma 持久化格式与运行时版本强相关；服务端统一使用已验证的精确版本。
    "chromadb==1.5.9",
    "langchain-community==0.4.1",
    # langchain-community 的 BM25Retriever 仅声明接口，索引实现需要此可选依赖。
    "rank-bm25==0.2.2",
    # BM25 建库与查询共用的中文搜索分词器。
    "jieba==0.42.1",
    "langchain-core==1.2.6",
    "langchain-huggingface==1.2.0",
    "langchain-openai==1.1.7",
    "langchain-tavily==0.2.16",
    "langchain-text-splitters==1.1.0",
    "langgraph==1.0.5",
    # langgraph 1.0.5 允许更新的 prebuilt，但 prebuilt 1.0.10 会导入
    # 仅在后续 langgraph 才提供的类型，因此显式保持同版本线。
    "langgraph-prebuilt==1.0.5",
    "langchain==1.2.3",
    "openai==2.14.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    # 3.1+ 要求 langgraph-checkpoint 4.x，与固定的 langgraph 1.0.5 不兼容。
    "langgraph-checkpoint-postgres==3.0.5",
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.2",
    "requests==2.32.5",
    "streamlit==1.54.0",
    "typing-extensions==4.15.0",
    # Knowledge Service 的正式 ASGI 入口，不能依赖开发环境中的间接安装。
    "uvicorn==0.52.4",
    "pymupdf==1.27.2",
    "pdfplumber==0.11.9",
    "redis==7.3.0",
    "sentence-transformers==5.2.3",
    "langgraph-checkpoint-sqlite==3.0.3",
    "python-docx==1.2.0",
    "pydantic-settings==2.12.0",
    "huggingface-hub==0.36.0",
    "prometheus-client==0.21.1",
    "httpx==0.28.1",
    # 当前 FastMCP 适配器仍使用 Python SDK v1 API；v2 是破坏性升级。
    "mcp>=1.28,<2",
]

[project.scripts]
financial-rag-mcp = "mcp_service.main:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.23.8",
    "asgi-lifespan==2.1.0",
    "fakeredis==2.36.2",
    "pytest-cov==5.0.0",
    "ruff==0.8.0",
]
eval = [
    "ragas==0.4.3",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"react_agent.configuration" = ["*.yaml"]
"react_agent.skills" = ["builtin/*/SKILL.md"]
